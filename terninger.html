<!DOCTYPE html>

<html lang="no"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/><meta content="#17131A" name="theme-color"/><title>DYPERE · To terninger</title><style>:root{--bg:#17131A;--card:#211B24;--ink:#F8E6D4;--muted:#B3A0A4;--gold:#CBA77E;--line:#53404A}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,sans-serif}main{max-width:700px;margin:auto;padding:calc(env(safe-area-inset-top) + 18px) 16px 40px}a{color:var(--gold)}header{text-align:center;margin-bottom:18px}.brand{color:var(--gold);letter-spacing:2px;font:normal 38px Georgia,serif}.muted{color:var(--muted)}.box{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:20px;margin:12px 0}h1,h2{font-family:Georgia,serif;font-weight:normal}h1{font-size:31px}.small{font-size:12px;color:var(--gold);letter-spacing:1.5px}button,.btn,select,input,textarea{font:inherit}button,.btn{border:1px solid var(--line);color:var(--ink);background:#302631;border-radius:10px;padding:12px 15px;cursor:pointer}.gold{background:var(--gold);color:var(--bg);border-color:var(--gold);font-weight:700}.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}.chosen{border-color:var(--gold);background:#594034}textarea,input,select{border:1px solid var(--line);color:var(--ink);background:#18131a;padding:12px;border-radius:10px;width:100%}textarea{min-height:66px;resize:vertical}label{display:block;color:var(--muted);font-size:12px;margin:10px 0 5px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{flex:1}nav{margin-bottom:12px}nav a{margin-right:12px}.soft-toggle{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);border-radius:12px;background:#2a2129;color:var(--ink);font-size:15px;margin:14px 0;cursor:pointer}.soft-toggle input{accent-color:var(--gold);width:23px;height:23px;flex:0 0 23px}.soft-toggle strong{font-weight:600}.hide{display:none}.bar{height:4px;background:#392c36;margin:12px 0;border-radius:4px;overflow:hidden}.bar i{display:block;background:var(--gold);height:100%}.question{font:normal clamp(22px,5vw,32px)/1.3 Georgia,serif;min-height:100px;margin:20px 0}.fine{font-size:12px;color:var(--muted)}@media(min-width:600px){.choices{grid-template-columns:repeat(5,1fr)}}@media print{@page{size:A4;margin:14mm}body{background:white;color:black}main{max-width:none}.noprint{display:none!important}.box{background:white;border:0}.question{min-height:0}}</style><link href="./rococo.css" rel="stylesheet"/><link href="./sections.css" rel="stylesheet"/><link href="./ui-consistency.css" rel="stylesheet"/><link href="./design-polish.css" rel="stylesheet"/><link href="./layout-balance.css" rel="stylesheet"/><link href="./navigation-v3.css" rel="stylesheet"/><link href="./play-fullscreen.css" rel="stylesheet"/><link rel="stylesheet" href="./adaptive-screens.css"><link rel="stylesheet" href="./unified-v3.css"><link rel="stylesheet" href="./design-system.css"></head><body data-d-section="play"><main class="play-root"><div class="play-heading"><a class="play-back" href="./lek-sammen.html" id="playBack">← Tilbake</a><span class="play-brand">DYPERE · LEK SAMMEN</span><span class="play-step" id="playStep">01 / 02</span></div><section class="play-screen active" id="screen-setup"><div class="play-intro"><span class="play-eyebrow">SPILL · OPPSETT</span><h1>Terninger</h1><p>Velg hvem som kaster, og hvor lekent det skal være.</p></div><div class="play-label">Hvem kaster?</div><div aria-label="Hvem kaster" class="choices" id="roller" role="group"><button aria-pressed="true" class="chosen" id="actorMaster" type="button">Mester</button><button aria-pressed="false" id="actorBaby" type="button">Baby</button></div><div class="play-label">Velg intensitet</div><div aria-label="Terningenes intensitet" class="choices" id="diceLevels" role="group"><button aria-pressed="false" data-level="myk" type="button">Mykt</button><button aria-pressed="true" class="chosen" data-level="frekk" type="button">Frekt</button><button aria-pressed="false" data-level="droy" type="button">På kanten</button></div><p class="fine" id="modeInfo"></p><button class="play-primary" id="startPlay" type="button">Start terningspillet →</button></section><section class="play-screen" id="screen-game"><div class="play-intro compact"><span class="play-eyebrow">SPILL · AKTIVITET</span><h1>Terninger</h1></div><div class="rococo-card is-ready" data-art="terninger" id="diceCard"><div class="rococo-kicker">DYPERE · SKJEBNEN VELGER</div><div class="rococo-title">TERNINGER</div><div class="rococo-separator">❦</div><div style="display:grid;grid-template-columns:1fr 1fr;width:100%;gap:14px"><div><div class="rococo-foot">HANDLING</div><div class="rococo-copy" id="die1">—</div></div><div><div class="rococo-foot">STED</div><div class="rococo-copy" id="die2">—</div></div></div><div class="rococo-foot" id="diceFooter">MESTER ✦ FREKT</div></div><button class="gold" id="roll">Kast begge terningene 🎲</button><p aria-live="polite" class="muted" id="instruction"></p><p class="play-note">Begge kan alltid velge et nytt kast eller si pass.</p></section></main><script src="./spillbank.js"></script><script>const $=s=>document.getElementById(s);
let actor='Mester',diceLevel='frekk',lastDice=null;
function choice(a){return a[Math.floor(Math.random()*a.length)]}
function setActor(a){actor=a;for(const [id,value] of [['actorMaster','Mester'],['actorBaby','Baby']]){const b=$(id);b.classList.toggle('chosen',a===value);b.setAttribute('aria-pressed',a===value?'true':'false')}description()}
$('actorMaster').onclick=()=>setActor('Mester');$('actorBaby').onclick=()=>setActor('Baby');
function description(){$('modeInfo').textContent=actor+' kaster · '+({myk:'Mykt',frekk:'Frekt',droy:'På kanten'}[diceLevel])+' på neste kast.';if(lastDice)$('instruction').textContent='Forrige kast: '+lastDice.actor+' · '+lastDice.action+' / '+lastDice.place+'. Nye valg gjelder først ved neste kast.';else $('instruction').textContent='Velg hvem som kaster, og trykk på terningknappen.';}
document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{diceLevel=b.dataset.level;document.querySelectorAll('[data-level]').forEach(x=>{x.classList.toggle('chosen',x===b);x.setAttribute('aria-pressed',x===b?'true':'false')});description()});
$('roll').onclick=()=>{const [action,place]=DYPERE_SPILL.terning(actor,{myk:"Mykt",frekk:"Frekt",droy:"På kanten"}[diceLevel]);$('die1').textContent=action;$('die2').textContent=place;$('diceCard').classList.remove('is-ready');$('diceFooter').textContent=actor+' ✦ '+diceLevel.toUpperCase();lastDice={actor,action,place,level:diceLevel};$('instruction').textContent=actor+' kastet: '+action+' / '+place+'. Nytt kast er alltid mulig.';};
description();</script><script>
(function(){
 const names=['setup','game','punishment']; let current='setup';
 function show(which){
  current=which;document.querySelectorAll('.play-screen').forEach(e=>e.classList.toggle('active',e.id==='screen-'+which));
  const back=document.getElementById('playBack');back.textContent=which==='setup'?'← Tilbake':'← Tilbake';
  back.setAttribute('href',which==='setup'?'./lek-sammen.html':'#');
  document.getElementById('playStep').textContent=which==='setup'?'01 / 02':which==='game'?'02 / 02':'EKSTRA';
  document.body.dataset.playStage=which;
 }
 document.getElementById('startPlay').onclick=()=>show('game');
 document.getElementById('playBack').addEventListener('click',e=>{if(current==='setup')return;e.preventDefault();show(current==='punishment'?'game':'setup')});
 const punishment=document.getElementById('showPunishment');if(punishment)punishment.onclick=()=>show('punishment');
 const ret=document.getElementById('returnGame');if(ret)ret.onclick=()=>show('game');
 // Keep the card fully visible when unusually long prompts are drawn.
 function fit(){for(const el of document.querySelectorAll('.play-screen.active .rococo-copy')){
  el.style.fontSize='';let size=parseFloat(getComputedStyle(el).fontSize);
  while(el.scrollHeight>el.clientHeight+2 && size>12){size-=1;el.style.fontSize=size+'px'}
 }}
 const observer=new MutationObserver(()=>requestAnimationFrame(fit));
 document.querySelectorAll('.rococo-copy').forEach(el=>observer.observe(el,{subtree:true,characterData:true,childList:true}));
 show('setup');
})();</script><script defer src="./adaptive-screens.js"></script></body></html>
