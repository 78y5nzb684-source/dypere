<!DOCTYPE html>

<html lang="nb"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/><meta content="#17131A" name="theme-color"/><meta content="yes" name="apple-mobile-web-app-capable"/><meta content="black-translucent" name="apple-mobile-web-app-status-bar-style"/><meta content="DYPERE" name="apple-mobile-web-app-title"/><link href="./manifest.webmanifest" rel="manifest"/><link href="./icons/icon-180.png" rel="apple-touch-icon"/><link href="./interface.css?build=3.0.14-beta-r1" rel="stylesheet"/><title>DYPERE · Terninger</title></head><body class="app-body" data-app-version="3.0.14 beta" data-file="terninger.html" data-layout="game" data-module="play" data-parent="index.html"><main class="app"><header class="app-header"><a class="nav-button" href="./index.html" id="playBack"><svg aria-hidden="true" viewbox="0 0 24 24"><path d="m14 5-7 7 7 7M7 12h13"></path></svg><span>Tilbake</span></a><span class="app-brand">DYPERE</span><a aria-label="Gå til hovedmenyen" class="nav-button" href="./index.html">Hovedmeny</a></header><div class="app-heading"><p class="eyebrow">LEK SAMMEN</p><h1 id="appTitle">Terninger</h1></div><section class="play-screen active stage game-setup surface" id="screen-setup"><p class="intro">Velg hvem som kaster. Handling og sted trekkes tilfeldig.</p><div class="play-label">Hvem kaster?</div><div aria-label="Hvem kaster" class="button-row role-options" id="roller" role="group"><button aria-pressed="true" class="chosen" id="actorMaster" type="button">Mester</button><button aria-pressed="false" id="actorBaby" type="button">Baby</button></div><div class="play-label">Kortbank</div><div aria-label="Terningenes kortbank" class="button-row single-column" id="diceLevels" role="group"><button disabled="True" type="button">Alle handlinger</button></div><p class="fine" id="modeInfo"></p><button class="primary start-action" id="startPlay" type="button">Start terningspillet →</button></section><section class="play-screen stage game-stage" id="screen-game"><div class="role-strip"><span class="field-label">Hvem har tur?</span><div class="button-row game-role-options"><button aria-pressed="true" class="selected" data-live-role="Mester" type="button">Mester</button><button aria-pressed="false" class="" data-live-role="Baby" type="button">Baby</button></div></div><div class="rococo-card is-ready" data-art="terninger" id="diceCard"><div class="rococo-kicker">DYPERE · SKJEBNEN VELGER</div><div class="rococo-title">TERNINGER</div><div class="rococo-separator">❦</div><div><div><div class="rococo-foot">HANDLING</div><div class="rococo-copy" id="die1">—</div></div><div><div class="rococo-foot">STED</div><div class="rococo-copy" id="die2">—</div></div></div><div class="rococo-foot" id="diceFooter">MESTER ✦ FREKT</div></div><div class="button-row game-secondary"><button class="" data-game-setup="" type="button">Oppsett</button><button class="" data-dice-pass="" type="button">Pass</button></div><button class="primary game-primary" id="roll">Kast</button><p aria-live="polite" class="muted" id="instruction"></p></section><span hidden="" id="playStep"></span></main><script src="./spillbank.js?build=3.0.14-beta-r1"></script><script>const $=s=>document.getElementById(s);
let actor='Mester',diceLevel='frekk',lastDice=null;
function choice(a){return a[Math.floor(Math.random()*a.length)]}
function setActor(a){actor=a;for(const [id,value] of [['actorMaster','Mester'],['actorBaby','Baby']]){const b=$(id);b.classList.toggle('chosen',a===value);b.setAttribute('aria-pressed',a===value?'true':'false')}description()}
$('actorMaster').onclick=()=>setActor('Mester');$('actorBaby').onclick=()=>setActor('Baby');
function description(){$('modeInfo').textContent=actor+' kaster · '+({myk:'Mykt',frekk:'Frekt',droy:'På kanten'}[diceLevel])+' på neste kast.';if(lastDice)$('instruction').textContent='Forrige kast: '+lastDice.actor+' · '+lastDice.action+' / '+lastDice.place+'. Nye valg gjelder først ved neste kast.';else $('instruction').textContent='Velg hvem som kaster, og trykk på «Kast».';}
document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{diceLevel=b.dataset.level;document.querySelectorAll('[data-level]').forEach(x=>{x.classList.toggle('chosen',x===b);x.setAttribute('aria-pressed',x===b?'true':'false')});description()});
$('roll').onclick=()=>{const [action,place]=DYPERE_SPILL.terning(actor,{myk:"Mykt",frekk:"Frekt",droy:"På kanten"}[diceLevel]);$('die1').textContent=action;$('die2').textContent=place;$('diceCard').classList.remove('is-ready');$('diceFooter').textContent=actor+' ✦ '+diceLevel.toUpperCase();lastDice={actor,action,place,level:diceLevel};$('instruction').textContent=actor+' kastet: '+action+' / '+place+'. Nytt kast er alltid mulig.';};
description();</script><script>
(function(){
 const names=['setup','game','punishment']; let current='setup';
 function show(which){
  current=which;document.querySelectorAll('.play-screen').forEach(e=>e.classList.toggle('active',e.id==='screen-'+which));
  const back=document.getElementById('playBack');back.textContent=which==='setup'?'← Tilbake':'← Tilbake';
  back.setAttribute('href',which==='setup'?'./index.html':'#');
  document.getElementById('playStep').textContent=which==='setup'?'01 / 02':which==='game'?'02 / 02':'EKSTRA';
  document.body.dataset.playStage=which;
 }
 document.getElementById('startPlay').onclick=()=>show('game');
 document.getElementById('playBack').addEventListener('click',e=>{if(current==='setup')return;e.preventDefault();show(current==='punishment'?'game':'setup')});
 const punishment=document.getElementById('showPunishment');if(punishment)punishment.onclick=()=>show('punishment');
 const ret=document.getElementById('returnGame');if(ret)ret.onclick=()=>show('game');
 show('setup');
})();</script><script src="./interface.js?build=3.0.14-beta-r1"></script></body></html>
