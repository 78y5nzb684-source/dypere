<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>DYPERE · Det tredje perspektivet</title><link rel="stylesheet" href="./sections.css"><link rel="stylesheet" href="./navigation-v3.css"><link rel="stylesheet" href="./adaptive-screens.css"><style>html,body{height:100%;overflow:hidden}body{margin:0;background:#17131a;color:#f8e6d4;font:16px system-ui}.frame{height:100dvh;max-width:680px;margin:auto;padding:calc(env(safe-area-inset-top) + 22px) 20px calc(env(safe-area-inset-bottom) + 20px);display:flex;flex-direction:column;gap:16px;box-sizing:border-box}.top{display:flex;justify-content:space-between;align-items:center}.top a{color:#d6b893;text-decoration:none}.title{text-align:center}.title h1{font:32px Georgia;margin:0;color:#e2c58f}.title p{color:#bca8af;font-size:13px}.card{min-height:0;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border:1px solid #705466;border-radius:26px;background:linear-gradient(150deg,#382438,#201820);padding:25px;gap:16px}.eyebrow{color:#d4b78c;font-size:12px;letter-spacing:.12em}.prompt{font:clamp(19px,4.5vw,27px)/1.4 Georgia,serif;overflow-wrap:anywhere}.footer{display:grid;grid-template-columns:1fr 1fr;gap:10px}.footer button{background:#39263b;color:#f8e6d4;border:1px solid #826477;border-radius:14px;padding:14px;min-height:50px;font:inherit}.footer button.primary{background:#d1ad81;color:#201820}.note{font-size:11px;text-align:center;color:#bda9b4}@media(max-height:650px){.frame{gap:8px;padding-top:calc(env(safe-area-inset-top) + 8px)}.title h1{font-size:24px}.title p{margin:2px}.card{padding:12px}}</style><link rel="stylesheet" href="./unified-v3.css"><link rel="stylesheet" href="./design-system.css"></head><body><main class="frame"><div class="top"><a href="./pa-kanten-meny.html">← På kanten</a><a href="./index.html">Hovedmeny ⌂</a></div><div class="title"><h1>DET TREDJE PERSPEKTIVET · På kanten</h1><p>Velg en kategori eller trekk tilfeldig</p></div><select id="category" aria-label="Kategori" style="border-radius:12px;padding:12px;background:#352637;color:#fff;border:1px solid #705466"></select><section class="card"><span class="eyebrow" id="counter">KLAR</span><div class="prompt" id="prompt">Trykk på «Trekk spørsmål» for å begynne.</div></section><div class="footer"><button id="pass" type="button">Pass</button><button id="next" type="button" class="primary">Trekk spørsmål →</button></div><div class="note">Safeword gjelder. Du kan alltid si stopp eller pass.</div></main><script>const FFM_GROUPS={"Lett – bare klining": ["Har du lyst at Mester skal be deg kysse en annen jente mens han ser på?", "Kunne du tenke deg at Mester sier du skal klinne med en jente, og så bare se på?", "Har du lyst at Mester skal kommandere deg til å kysse henne, uten at han rører henne?", "Kunne du tenke deg at Mester bestemmer hvor lenge du skal kysse henne?", "Har du lyst at Mester skal si «kyss henne nå», og så bare se på?"], "Mer – berøring": ["Har du lyst at Mester skal be deg ta på titsene hennes mens han ser på?", "Kunne du tenke deg at Mester kommanderer deg til å slikke henne, uten at han er borti henne?", "Har du lyst at Mester skal si du skal fingre henne, mens han bare ser?", "Kunne du tenke deg at Mester bestemmer at du skal suge på nipplene hennes?", "Har du lyst at Mester skal gi deg beskjed om å spre henne, og så se på?"], "Videre – sex": ["Har du lyst at Mester skal be deg slikke fitta hennes mens han ser på?", "Kunne du tenke deg at Mester kommanderer deg til å bruke en leke på henne?", "Har du lyst at Mester skal si du skal få henne til å komme, uten at han rører henne?", "Kunne du tenke deg at Mester bestemmer at du skal sitte på ansiktet hennes?", "Har du lyst at Mester skal gi deg beskjed om å ta henne med en dildo mens han ser?"], "Fullt – men Mester er bare med Baby": ["Har du lyst at Mester skal ta deg mens du slikker en annen jente?", "Kunne du tenke deg at Mester kommanderer deg til å ha plug i mens du er med henne?", "Har du lyst at Mester skal si du skal komme på henne, og så ta deg etterpå?", "Kunne du tenke deg at Mester bestemmer at du skal være mellom ham og henne – men han rører bare deg?", "Har du lyst at Mester skal ha full kontroll over deg, mens du gjør det han sier med henne?"], "Tydelige rammer": ["Er det viktig for deg at Mester aldri rører den andre?", "Har du lyst at det skal være tydelig at Mester bare kommanderer deg?", "Kunne du tenke deg at Mester sier stopp hvis du blir sjalu?", "Har du lyst å utforske hvor grensen din går – mens Mester bare ser og styrer deg?", "Kunne du tenke deg at Mester sjekker inn med deg underveis?"]};const FFM_RANDOM=["Kunne du tenke deg at Mester bestemmer hvor lenge du skal kysse henne?", "Kunne du tenke deg at Mester sjekker inn med deg underveis?", "Har du lyst å utforske hvor grensen din går – mens Mester bare ser og styrer deg?", "Kunne du tenke deg at Mester bestemmer at du skal være mellom ham og henne – men han rører bare deg?", "Kunne du tenke deg at Mester bestemmer at du skal suge på nipplene hennes?", "Kunne du tenke deg at Mester bestemmer at du skal sitte på ansiktet hennes?", "Har du lyst at Mester skal ta deg mens du slikker en annen jente?", "Har du lyst at Mester skal be deg ta på titsene hennes mens han ser på?", "Har du lyst at Mester skal be deg slikke fitta hennes mens han ser på?", "Har du lyst at Mester skal be deg kysse en annen jente mens han ser på?", "Er det viktig for deg at Mester aldri rører den andre?", "Har du lyst at Mester skal gi deg beskjed om å spre henne, og så se på?", "Kunne du tenke deg at Mester kommanderer deg til å bruke en leke på henne?", "Har du lyst at Mester skal ha full kontroll over deg, mens du gjør det han sier med henne?", "Har du lyst at Mester skal si «kyss henne nå», og så bare se på?", "Har du lyst at Mester skal gi deg beskjed om å ta henne med en dildo mens han ser?", "Har du lyst at Mester skal si du skal fingre henne, mens han bare ser?", "Kunne du tenke deg at Mester kommanderer deg til å slikke henne, uten at han er borti henne?", "Kunne du tenke deg at Mester sier du skal klinne med en jente, og så bare se på?", "Har du lyst at Mester skal kommandere deg til å kysse henne, uten at han rører henne?", "Kunne du tenke deg at Mester kommanderer deg til å ha plug i mens du er med henne?", "Har du lyst at Mester skal si du skal få henne til å komme, uten at han rører henne?", "Har du lyst at Mester skal si du skal komme på henne, og så ta deg etterpå?", "Har du lyst at det skal være tydelig at Mester bare kommanderer deg?", "Kunne du tenke deg at Mester sier stopp hvis du blir sjalu?"];const select=document.getElementById('category');const prompt=document.getElementById('prompt');const count=document.getElementById('counter');select.innerHTML='<option value="random">Tilfeldig · alle spørsmål</option>'+Object.keys(FFM_GROUPS).map((v,i)=>'<option value="'+i+'">'+v+'</option>').join('');let prev='';function draw(){const value=select.value;const arr=value==='random'?FFM_RANDOM:Object.values(FFM_GROUPS)[Number(value)];let pool=arr.filter(x=>x!==prev);if(!pool.length)pool=arr;prev=pool[Math.floor(Math.random()*pool.length)];prompt.textContent=prev;count.textContent='SPØRSMÅL · '+(value==='random'?'TILFELDIG':Object.keys(FFM_GROUPS)[Number(value)].toUpperCase())}document.getElementById('next').onclick=draw;document.getElementById('pass').onclick=draw;</script></body></html>
