<script>
function showOrdbok(){
  const dialog=document.getElementById('ordbokDialog');
  if(dialog.open)return;
  const content=document.getElementById('ordbokContent');
  content.replaceChildren();
  const entries=Object.entries(window.DypereOrdbok||{});
  if(!entries.length){
    const note=document.createElement('p');
    note.textContent='Ordboken er ikke tilgjengelig. Last inn siden på nytt når du har nett.';
    content.append(note);
  }
  for(const [term,definition] of entries){
    const entry=document.createElement('div');
    const heading=document.createElement('dt');
    const description=document.createElement('dd');
    heading.textContent=term;
    description.textContent=definition;
    entry.append(heading,description);
    content.append(entry);
  }
  dialog.showModal();
}
document.getElementById('openOrdbok').addEventListener('click',showOrdbok);
document.getElementById('closeOrdbok').addEventListener('click',()=>document.getElementById('ordbokDialog').close());
document.getElementById('ordbokDialog').addEventListener('close',()=>document.getElementById('openOrdbok').focus());
document.getElementById('ordbokDialog').addEventListener('click',event=>{
  if(event.target===event.currentTarget){
    const rect=event.currentTarget.getBoundingClientRect();
    if(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom)event.currentTarget.close();
  }
});
</script>
