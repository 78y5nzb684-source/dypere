</div><footer class="app-footer">DYPERE · 3.0.18 beta · Privat</footer></main>
<dialog id="ordbokDialog" class="studio-dialog dictionary-dialog" aria-labelledby="ordbokTitle">
<header class="dictionary-heading"><h2 id="ordbokTitle">Ordbok</h2><button type="button" id="closeOrdbok" autofocus>Lukk</button></header>
<dl id="ordbokContent" class="dictionary-content"></dl>
</dialog><script src="./play-common.js?build=3.0.18-beta-r1"></script><script src="./game-engine.js?build=3.0.18-beta-r1"></script><script src="./card-store.js?build=3.0.18-beta-r1"></script><script src="./bildeprompts-extra.js?build=3.0.18-beta-r1"></script><script src="./quick-photo-v2.js?build=3.0.18-beta-r1"></script><script src="./interface.js?build=3.0.18-beta-r1"></script><script src="./journey-language.js?build=3.0.18-beta-r1"></script><script src="./ordbok.js?build=3.0.18-beta-r1"></script>
<script>
function showOrdbok(){
  const dialog=document.getElementById('ordbokDialog');
  if(dialog.open)return;
  const content=document.getElementById('ordbokContent');
  content.replaceChildren();
  const entries=window.DypereJourneyLanguage ? Object.entries(window.DypereJourneyLanguage).filter(([,value])=>value.explanation).map(([term,value])=>[term,value.explanation]) : Object.entries(window.DypereOrdbok||{});
  if(!entries.length){
    const note=document.createElement('p');
    note.textContent='Ordboken er ikke tilgjengelig. Last inn siden på nytt når du har nett.';
    content.append(note);
  }
  for(const [term,definition] of entries){
    const entry=document.createElement('div');
    const heading=document.createElement('dt');
    const description=document.createElement('dd');
    heading.textContent=term;
    description.textContent=definition;
    entry.append(heading,description);
    content.append(entry);
  }
  dialog.showModal();
}
document.getElementById('openOrdbok').addEventListener('click',showOrdbok);
document.getElementById('closeOrdbok').addEventListener('click',()=>document.getElementById('ordbokDialog').close());
document.getElementById('ordbokDialog').addEventListener('close',()=>document.getElementById('openOrdbok').focus());
document.getElementById('ordbokDialog').addEventListener('click',event=>{
  if(event.target===event.currentTarget){
    const rect=event.currentTarget.getBoundingClientRect();
    if(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom)event.currentTarget.close();
  }
});
</script>
</body></html>
