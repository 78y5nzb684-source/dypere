<!DOCTYPE html>

<html lang="nb"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/><meta content="#17131A" name="theme-color"/><meta content="yes" name="apple-mobile-web-app-capable"/><meta content="black-translucent" name="apple-mobile-web-app-status-bar-style"/><meta content="DYPERE" name="apple-mobile-web-app-title"/><link href="./manifest.webmanifest" rel="manifest"/><link href="./icons/icon-180.png" rel="apple-touch-icon"/><link href="./interface.css?build=3.0.5-beta-r3" rel="stylesheet"/><title>DYPERE · Uten filter</title></head><body class="app-body" data-app-version="3.0.5 beta" data-file="pa-kanten-quiz.html" data-layout="questions" data-module="explore" data-parent="pa-kanten-meny.html"><main class="app"><header class="app-header"><a class="nav-button" href="./pa-kanten-meny.html" id="appBack"><svg aria-hidden="true" viewbox="0 0 24 24"><path d="m14 5-7 7 7 7M7 12h13"></path></svg><span>Tilbake</span></a><span class="app-brand">DYPERE</span><a aria-label="Gå til hovedmenyen" class="nav-button" href="./index.html">Hovedmeny</a></header><div class="app-heading"><p class="eyebrow">PÅ KANTEN</p><h1 id="appTitle">Uten filter</h1></div><section class="box stage setup-stage" id="setup"><div class="surface setup-card"><p class="intro">Separate svar. Nysgjerrighet er ikke et ja.</p><div class="setup-fields"><div class="field"><label for="role">Hvem svarer?</label><select id="role"><option value="">Velg rolle</option><option value="Mester">Mester</option><option value="Baby">Baby</option></select></div><div class="field"><label for="name">Navn</label><input autocomplete="off" id="name" type="text"/></div><div class="field"><label for="date">Dato</label><input autocomplete="off" id="date" type="text"/></div></div><p class="muted fine">Lagres lokalt. Last ned for sikkerhetskopi.</p><div class="button-row setup-actions"><button class="primary" id="start" type="button">Begynn →</button><button class="" id="loadStart" type="button">Åpne svarfil</button></div></div></section><section class="box hide stage question-stage" id="survey"><div class="surface question-card"><div class="question-meta"><span id="counter"></span></div><div class="progress-track"><i id="bar"></i></div><div class="reading-region"><div class="question" id="question"></div></div><div class="text-pager" hidden=""></div><div aria-label="Svaralternativer" class="answer-grid" id="choices"></div><div class="choice-pager" hidden=""></div></div><div class="button-row auxiliary-actions"><button class="secondary" data-open="commentSheet" id="commentToggle" type="button">Kommentar</button><button class="secondary" data-open="toolsSheet" type="button">Mer</button></div><div class="button-row question-actions"><button class="" id="back" type="button">← Forrige</button><button class="primary" id="next" type="button">Neste →</button></div></section><section class="box hide stage archive-stage surface" id="archive"><h1>Din besvarelse</h1><p class="muted" id="status"></p><div class="button-row"><button class="gold" id="export">Lagre JSON</button><button id="pdf">PDF / Utskrift</button></div><label>Åpne tidligere JSON-svar</label><input accept=".json,application/json" id="import" type="file"><div class="button-row"><button id="resume">Til spørsmålene</button><button id="newOrder">Trekk på nytt</button></div><p class="notice" id="message"></p></input></section></main><dialog aria-labelledby="commentSheet-title" class="sheet" id="commentSheet"><form class="sheet-top" method="dialog"><h2 id="commentSheet-title">Kommentar</h2><button class="nav-button" type="submit">Ferdig</button></form><div class="sheet-content"><textarea aria-label="Kommentar" class="comment-input" id="comment" placeholder="Hva tenker du egentlig? …"></textarea><p class="fine">Kommentarer lagres sammen med svaret.</p></div></dialog><dialog aria-labelledby="toolsSheet-title" class="sheet" id="toolsSheet"><form class="sheet-top" method="dialog"><h2 id="toolsSheet-title">Verktøy</h2><button class="nav-button" type="submit">Ferdig</button></form><div class="sheet-content"><div class="button-row"><button class="primary" id="save" type="button">Last ned</button><button class="" data-close-sheet="" id="reshuffle" type="button">Bland rekkefølge</button></div><button class="" data-archive="" data-close-sheet="" type="button">Se besvarelse</button><p class="fine">Spørsmålene vises i tilfeldig rekkefølge. Svarene beholdes når rekkefølgen endres.</p></div></dialog><div class="hide" id="printView"></div><script>
const QUESTIONS=["Mester bestemmer at du ikke får komme i kveld. Hvordan kjennes det?", "Du må spørre pent om å få komme. Vil du høre deg selv gjøre det?", "Du får en belønning hvis du tar imot slag på rompa. Frister det?", "Du får ikke røre deg selv uten lov. Hvor lenge tror du at du klarer?", "Mester edger deg lenge og bestemmer om du får komme. Vil du det?", "Du skal ha plug i rompa en stund. Ok?", "Mester kommer, du får ikke. Fair?", "Du får suge ham til han kommer. Vil du det?", "Du får ikke komme før du har fått ham til å komme. Aksepterer du?", "Du skal holde deg åpen mens han ser. Vil du det?", "Du får noen slag på klitoris. Hvor mange tror du at du tåler?", "Du får velge: komme nå, eller vente og få noe bedre senere.", "Du skal sove med plug i. Ok?", "Du må spørre om lov før du får suge ham.", "Han edger deg lenge, så får du lov. Vil du det?", "Du får en belønning hvis du tar imot ham i rompa.", "Han kommer på deg. Vil du det?", "Du må telle hvert slag og takke etterpå.", "Du skal gå uten truse en dag. Ok?", "Du får komme bare hvis du spør pent nok.", "Han holder deg fast og nekter deg å komme.", "Du skal ha bind for øynene mens han bestemmer.", "Han slikker deg til du kommer. Vil du det?", "Du skal suge ham ren etterpå.", "Du skal være på kne en stund.", "Du får ikke komme før han sier det.", "Han bruker vibrator på deg og stopper når han vil.", "Du skal vise frem og vente på beskjed.", "Han kommer i munnen din.", "Du skal ha plug i en stund uten å få røre deg.", "Du skal edge deg selv og stoppe på kommando.", "Du får en belønning hvis du klarer å vente.", "Han slår deg, så tar han deg.", "Du skal ligge klar når han kommer hjem.", "Du får ikke komme på en stund.", "Du får suge ham mens han gjør noe annet.", "Du får komme, men bare på ham.", "Du skal takke ham etterpå.", "Han edger deg med munnen og bestemmer.", "Du får velge: slag eller å vente med å komme."];
const ID='DYPERE-2026-FILTER', VERSION='1.0', $=id=>document.getElementById(id), choices=[['ja','Ja'],['apen','Åpen'],['nysgjerrig','Nysgjerrig'],['nei','Nei'],['pass','Pass']];
let d={surveyId:ID,version:VERSION,role:'',name:'',date:'',answers:{},order:[]},at=0;
function shuffle(){let a=QUESTIONS.map((_,i)=>i);for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function show(id){for(let s of ['setup','survey','archive'])$(s).classList.toggle('hide',id!==s);window.scrollTo(0,0);if(id==='survey')render();if(id==='archive')$('status').textContent=`${Object.values(d.answers).filter(a=>a.choice).length} av ${QUESTIONS.length} besvart`}
function saveLocal(){try{localStorage.setItem(ID+'_'+d.role,JSON.stringify(d))}catch(e){}}
function collect(){d.role=$('role').value;d.name=$('name').value.trim();d.date=$('date').value;saveLocal()}
function render(){if(!d.order.length)d.order=shuffle();let n=d.order[at],id='Q'+String(n+1).padStart(3,'0'),a=d.answers[id]||{};$('counter').textContent=`SPØRSMÅL ${at+1} / ${QUESTIONS.length} · ID ${id}`;$('bar').style.width=((at+1)/QUESTIONS.length*100)+'%';$('question').textContent=QUESTIONS[n];$('choices').replaceChildren();for(let [v,label] of choices){let b=document.createElement('button');b.textContent=label;b.className=a.choice===v?'selected':'';b.onclick=()=>{d.answers[id]={...d.answers[id],choice:v};saveLocal();render()};$('choices').appendChild(b)}$('comment').value=a.comment||'';$('back').disabled=at===0;$('next').textContent=at===QUESTIONS.length-1?'Se besvarelse →':'Neste →'}
$('comment').oninput=e=>{let id='Q'+String(d.order[at]+1).padStart(3,'0');d.answers[id]={...d.answers[id],comment:e.target.value};saveLocal()};
$('start').onclick=()=>{if(!$('role').value||!$('name').value.trim()){alert('Velg rolle og navn.');return}collect();if(!d.order.length)d.order=shuffle();show('survey')};
$('next').onclick=()=>{if(at===QUESTIONS.length-1)show('archive');else{at++;show('survey')}};$('back').onclick=()=>{at=Math.max(0,at-1);show('survey')};
function reorder(){if(!confirm('Vil du blande rekkefølgen? Svarene beholdes.'))return;d.order=shuffle();at=0;saveLocal();show('survey')};$('reshuffle').onclick=reorder;$('newOrder').onclick=reorder;
function download(){collect();let blob=new Blob([JSON.stringify({...d,questionCount:QUESTIONS.length,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`DYPERE_FILTER_${d.role}_${d.date}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)};$('save').onclick=download;$('export').onclick=download;
function validate(x){if(x.surveyId!==ID||x.version!==VERSION||!['Mester','Baby'].includes(x.role)||!x.answers||!Array.isArray(x.order)||x.order.length!==QUESTIONS.length||new Set(x.order).size!==QUESTIONS.length||x.order.some(v=>!Number.isInteger(v)||v<0||v>=QUESTIONS.length))throw Error('Svarfilen passer ikke denne modulen');return x}
async function openFile(file){if(!file)return;try{let x=validate(JSON.parse(await file.text()));if(!confirm('Åpne svarfil og erstatte nåværende besvarelse?'))return;d=x;at=0;$('role').value=d.role;$('name').value=d.name;$('date').value=d.date;saveLocal();show('survey')}catch(e){alert(e.message)}}$('import').onchange=e=>openFile(e.target.files[0]);$('loadStart').onclick=()=>$('import').click();
$('resume').onclick=()=>show('survey');function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))};$('pdf').onclick=()=>{let html=`<h1>DYPERE · På kanten</h1><p>${esc(d.role)} · ${esc(d.name)} · ${esc(d.date)}</p>`;for(let i=0;i<QUESTIONS.length;i++){let a=d.answers['Q'+String(i+1).padStart(3,'0')]||{},val=choices.find(x=>x[0]===a.choice)?.[1]||'Ubesvart';html+=`<article><b>${i+1}. ${esc(QUESTIONS[i])}</b><p>${esc(val)}</p>${a.comment?`<small>${esc(a.comment)}</small>`:''}</article>`}$('printView').innerHTML=html;window.print()};
$('date').value=new Date().toLocaleDateString('sv-SE');try{let matches=Object.keys(localStorage).filter(x=>x.startsWith(ID+'_'));if(matches.length===1){let x=validate(JSON.parse(localStorage.getItem(matches[0])));d=x;$('role').value=d.role;$('name').value=d.name;$('date').value=d.date}}catch(e){}
</script><script src="./interface.js?build=3.0.5-beta-r3"></script></body></html>
