enge og bestemmer om du får komme. Vil du det?", "Du skal ha plug i rompa en stund. Ok?", "Mester kommer, du får ikke. Fair?", "Du får suge ham til han kommer. Vil du det?", "Du får ikke komme før du har fått ham til å komme. Aksepterer du?", "Du skal holde deg åpen mens han ser. Vil du det?", "Du får noen slag på klitoris. Hvor mange tror du at du tåler?", "Du får velge: komme nå, eller vente og få noe bedre senere.", "Du skal sove med plug i. Ok?", "Du må spørre om lov før du får suge ham.", "Han edger deg lenge, så får du lov. Vil du det?", "Du får en belønning hvis du tar imot ham i rompa.", "Han kommer på deg. Vil du det?", "Du må telle hvert slag og takke etterpå.", "Du skal gå uten truse en dag. Ok?", "Du får komme bare hvis du spør pent nok.", "Han holder deg fast og nekter deg å komme.", "Du skal ha bind for øynene mens han bestemmer.", "Han slikker deg til du kommer. Vil du det?", "Du skal suge ham ren etterpå.", "Du skal være på kne en stund.", "Du får ikke komme før han sier det.", "Han bruker vibrator på deg og stopper når han vil.", "Du skal vise frem og vente på beskjed.", "Han kommer i munnen din.", "Du skal ha plug i en stund uten å få røre deg.", "Du skal edge deg selv og stoppe på kommando.", "Du får en belønning hvis du klarer å vente.", "Han slår deg, så tar han deg.", "Du skal ligge klar når han kommer hjem.", "Du får ikke komme på en stund.", "Du får suge ham mens han gjør noe annet.", "Du får komme, men bare på ham.", "Du skal takke ham etterpå.", "Han edger deg med munnen og bestemmer.", "Du får velge: slag eller å vente med å komme."];const ID='DYPERE-PA-KANTEN-QUIZ-2026',VERSION='1.0',options=[['ja','Ja'],['apen','Åpen'],['nysgjerrig','Nysgjerrig'],['nei','Nei'],['pass','Pass']];let index=0,data={surveyId:ID,version:VERSION,role:'',name:'',date:new Date().toISOString().slice(0,10),answers:{}};const $=id=>document.getElementById(id);const key=()=>ID+'_'+data.role;function save(){try{localStorage.setItem(key(),JSON.stringify(data))}catch(e){$('notice').textContent='Mellomlagring utilgjengelig. Eksporter JSON jevnlig.'}}function render(){let q='Q'+String(index+1).padStart(3,'0'),a=data.answers[q]||{};$('position').textContent=`SPØRSMÅL ${index+1} / ${QUESTIONS.length}`;$('bar').style.width=(index+1)*100/QUESTIONS.length+'%';$('question').textContent=QUESTIONS[index];$('choices').replaceChildren();options.forEach(([val,text])=>{let b=document.createElement('button');b.textContent=text;b.className=a.choice===val?'chosen':'';b.onclick=()=>{data.answers[q]={...data.answers[q],choice:val};save();render()};$('choices').append(b)});$('comment').value=a.comment||'';$('prev').disabled=index===0;$('next').textContent=index===QUESTIONS.length-1?'Ferdig ✓':'Neste →'}$('start').onclick=()=>{data.role=$('role').value;data.name=$('name').value.trim();if(!data.name){alert('Fyll inn navn først');return}try{let old=JSON.parse(localStorage.getItem(key()));if(old&&old.version===VERSION&&old.name===data.name)data=old}catch(e){}document.querySelector('section.panel').hidden=true;$('form').hidden=false;render()};$('comment').oninput=e=>{let q='Q'+String(index+1).padStart(3,'0');data.answers[q]={...data.answers[q],comment:e.target.value};save()};$('prev').onclick=()=>{if(index>0)index--;render()};$('next').onclick=()=>{if(index<QUESTIONS.length-1)index++;else $('notice').textContent='Ferdig – last ned svarfilen for sammenligning.';render()};$('export').onclick=()=>{let blob=new Blob([JSON.stringify({...data,questions:QUESTIONS,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`DYPERE_PaKanten_${data.role}_${data.date}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),20000)};</script><script defer src="./adaptive-screens.js"></script></body></html>
