<!DOCTYPE html>

<html lang="no"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/><title>DYPERE · På kanten – Quiz</title><style>:root{--bg:#17131A;--panel:#211B24;--gold:#CBA77E;--ink:#F8E6D4;--muted:#B3A0A4;--line:#53404A}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif}main{max-width:670px;margin:auto;padding:calc(env(safe-area-inset-top) + 15px) 16px 48px}.brand{text-align:center;color:var(--gold);font:46px Georgia,serif}.panel{border:1px solid var(--line);border-radius:18px;background:var(--panel);padding:24px;margin-top:20px}h1,h2{font:normal 30px Georgia,serif}h2{font-size:25px}p,small{color:var(--muted)}button,input,textarea,select{font:inherit}button,select,input,textarea{border:1px solid var(--line);border-radius:9px;padding:13px;background:#2b222b;color:var(--ink)}button{cursor:pointer}.gold,.chosen{background:var(--gold);color:#17131A}input,textarea{width:100%}.choices{display:grid;grid-template-columns:1fr 1fr;gap:9px}.choices button:last-child{grid-column:1/-1}.nav{display:flex;justify-content:space-between;gap:12px;margin-top:18px}.nav button{flex:1}.bar{height:4px;background:#42333e;margin:18px 0}.bar>div{background:var(--gold);height:100%}a{color:var(--gold)}label{display:block;color:var(--muted);margin-top:12px}textarea{min-height:75px}@media(max-height:740px){.panel{padding:15px}h2{font-size:22px}}</style><link href="./rococo.css" rel="stylesheet"/><style>.rococo-quiz-header{height:205px;max-width:450px;margin:10px auto 20px;background:#202A40 url('./ornaments/quiz.svg') center/100% 100% no-repeat;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:5px;text-align:center}.rococo-quiz-header span{font:12px Georgia,serif;color:#DAC59F;letter-spacing:.2em}.rococo-quiz-header strong{font:30px Georgia,serif;color:#F6EBDD}</style><link href="./sections.css" rel="stylesheet"/><link rel="stylesheet" href="./ui-consistency.css"/><link rel="stylesheet" href="./design-polish.css"/></head><body data-d-section="explore"><nav aria-label="Navigasjon mellom delene" class="d-section-nav"><a class="d-back" href="./index.html">← DYPERE</a><strong>UTFORSKNING · PRIVAT QUIZ</strong><a class="d-other" href="./index.html#utforskning">Alle valg ↗</a></nav><main><div class="brand">DYPERE</div><section class="panel"><small>NY MODUL · 20 SPØRSMÅL</small><h1>På kanten – Quiz</h1><p>Utforsk utfordrende preferanser gjennom konkrete spørsmål. Begge svarer hver for seg, uten at nysgjerrighet regnes som et ja.</p><label>Jeg svarer som</label><select id="role"><option>Mester</option><option>Baby</option></select><label>Navn eller kallenavn</label><input id="name" placeholder="Navn"/><button class="gold" id="start" style="width:100%;margin-top:18px">Begynn →</button></section><section class="panel" hidden="" id="form"><div id="position"></div><div class="bar"><div id="bar"></div></div><h2 id="question"></h2><div class="choices" id="choices"></div><label>Kommentar (valgfritt)</label><textarea id="comment" placeholder="Hva mener du mer presist?"></textarea><div class="nav"><button id="prev">← Forrige</button><button class="gold" id="next">Neste →</button></div><button id="export" style="width:100%;margin-top:12px">↓ Last ned svarfil (JSON)</button><small id="notice"></small></section></main><script>const QUESTIONS=["Hva er mest spennende ved en strengere Mester-rolle: ordbruk, ritualer eller tydeligere oppgaver?", "Kunne et privat rollespill med et mer vågalt antrekk vekke nysgjerrighet?", "Hvilket virker mest utfordrende: å få et uventet oppdrag eller å planlegge et selv?", "Hvordan ville du oppleve at Mester valgte et nytt hjelpemiddel innenfor et kjent tema?", "Kunne et rollespill med bind for øynene og tydelige instruksjoner være interessant?", "Hva gir sterkest forventning: en lukket konvolutt, en hemmelig plan eller et nytt antrekk?", "Kunne et rollespill med skarpere språk være interessant som fantasi, uten å prøve det?", "Er det mer interessant å utforske ett avansert tema enn å kombinere mange små utfordringer?", "Kunne dere tenke dere å snakke om en analfantasi som foreløpig bare skal forbli en fantasi?", "Hva gjør et nytt intimt hjelpemiddel mest spennende: formålet, overraskelsen eller rollefordelingen?", "Kunne en utfordring der Baby selv velger intensiteten bevare spenningen?", "Er tanken på en belønning mer spennende når innholdet er ukjent?", "Hva ville gjort en alternativ Mesterinne-rolle interessant eller uinteressant i et fiktivt rollespill?", "Kunne tanken på en tilfeldig flørt vekke både interesse og sjalusi?", "Er det mer utfordrende å se Baby kysse ei jente, eller å snakke om følelsene etterpå?", "Ville dere foretrukket et nytt møte som bare innebærer samtale, fremfor et avtalt rollespill?", "Hva ville føles annerledes med en venninne sammenlignet med en ukjent voksen jente?", "Kunne en tredje person få en rolle i et scenario uten å overta dynamikken mellom Mester og Baby?", "Hvor går skillet mellom en spennende fantasi og noe du faktisk ønsker å foreslå?", "Hvilken uprøvde fantasi ville du helst høre partnerens egne tanker om før dere bestemmer noe?"];const ID='DYPERE-PA-KANTEN-QUIZ-2026',VERSION='1.0',options=[['ja','Ja'],['apen','Åpen'],['nysgjerrig','Nysgjerrig'],['nei','Nei'],['pass','Pass']];let index=0,data={surveyId:ID,version:VERSION,role:'',name:'',date:new Date().toISOString().slice(0,10),answers:{}};const $=id=>document.getElementById(id);const key=()=>ID+'_'+data.role;function save(){try{localStorage.setItem(key(),JSON.stringify(data))}catch(e){$('notice').textContent='Mellomlagring utilgjengelig. Eksporter JSON jevnlig.'}}function render(){let q='Q'+String(index+1).padStart(3,'0'),a=data.answers[q]||{};$('position').textContent=`SPØRSMÅL ${index+1} / 20`;$('bar').style.width=(index+1)*5+'%';$('question').textContent=QUESTIONS[index];$('choices').replaceChildren();options.forEach(([val,text])=>{let b=document.createElement('button');b.textContent=text;b.className=a.choice===val?'chosen':'';b.onclick=()=>{data.answers[q]={...data.answers[q],choice:val};save();render()};$('choices').append(b)});$('comment').value=a.comment||'';$('prev').disabled=index===0;$('next').textContent=index===19?'Ferdig ✓':'Neste →'}$('start').onclick=()=>{data.role=$('role').value;data.name=$('name').value.trim();if(!data.name){alert('Fyll inn navn først');return}try{let old=JSON.parse(localStorage.getItem(key()));if(old&&old.version===VERSION&&old.name===data.name)data=old}catch(e){}document.querySelector('section.panel').hidden=true;$('form').hidden=false;render()};$('comment').oninput=e=>{let q='Q'+String(index+1).padStart(3,'0');data.answers[q]={...data.answers[q],comment:e.target.value};save()};$('prev').onclick=()=>{if(index>0)index--;render()};$('next').onclick=()=>{if(index<19)index++;else $('notice').textContent='Ferdig – last ned svarfilen for sammenligning.';render()};$('export').onclick=()=>{let blob=new Blob([JSON.stringify({...data,questions:QUESTIONS,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`DYPERE_PaKanten_${data.role}_${data.date}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),20000)};</script></body></html>
