<!DOCTYPE html>

<html lang="nb"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/><meta content="#17131A" name="theme-color"/><meta content="yes" name="apple-mobile-web-app-capable"/><meta content="black-translucent" name="apple-mobile-web-app-status-bar-style"/><meta content="DYPERE" name="apple-mobile-web-app-title"/><link href="./manifest.webmanifest" rel="manifest"/><link href="./icons/icon-180.png" rel="apple-touch-icon"/><link href="./interface.css?build=20261027-design" rel="stylesheet"/><title>DYPERE · Bilde</title></head><body class="app-body" data-app-version="3.0.2" data-file="bildeutfordring.html" data-layout="game" data-module="play" data-parent="lek-sammen.html"><main class="app"><header class="app-header"><a class="nav-button" href="./lek-sammen.html" id="playBack"><svg aria-hidden="true" viewbox="0 0 24 24"><path d="m14 5-7 7 7 7M7 12h13"></path></svg><span>Tilbake</span></a><span class="app-brand">DYPERE</span><a aria-label="Gå til hovedmenyen" class="nav-button" href="./index.html">Hovedmeny</a></header><div class="app-heading"><p class="eyebrow">LEK SAMMEN</p><h1 id="appTitle">Bilde</h1></div><section class="play-screen active stage game-setup surface" id="screen-setup"><p class="intro">Velg en stemning. Én utfordring om gangen.</p><div class="play-label">Hvem skal få bildeutfordringen?</div><div aria-label="Velg mottaker" class="button-row role-options" role="group"><button aria-pressed="true" class="photo-role chosen" data-role="Baby" type="button">Baby</button><button aria-pressed="false" class="photo-role" data-role="Mester" type="button">Mester</button></div><p class="photo-role-hint" id="roleInfo">Utfordringer til Baby</p><div class="play-label">Velg nivå</div><select id="level"><option value="Alle">Overrask meg · alle nivåer</option><option>Lett</option><option>Mer</option><option>På kanten</option><option value="Drøye">Drøye · 50 nye</option></select><p aria-live="polite" class="fine" id="levelInfo"></p><button class="primary start-action" id="startPlay" type="button">Start bildeutfordringen →</button></section><section class="play-screen stage game-stage" id="screen-game"><div class="role-strip"><span class="field-label">Hvem har tur?</span><div class="button-row game-role-options"><button aria-pressed="false" class="" data-live-role="Mester" type="button">Mester</button><button aria-pressed="true" class="selected" data-live-role="Baby" type="button">Baby</button></div></div><div aria-live="polite" class="rococo-card is-ready" data-art="bilde" id="photoCard"><div class="rococo-kicker" id="photoRecipient">DYPERE · TIL BABY</div><div class="rococo-title">BILDE</div><div class="rococo-separator">❦</div><div class="rococo-copy" id="photoPrompt">Trykk på knappen for å trekke en bildeidé.</div><div class="rococo-foot" id="pLevel">KLAR?</div></div><div class="button-row game-secondary"><button id="skipPhoto" type="button">Pass</button><button class="" data-game-setup="" type="button">Nivå</button></div><button class="primary game-primary" id="drawPhoto">Trekk</button><p class="play-note">Ingen bilder blir lagret eller sendt av appen.</p></section><span hidden="" id="playStep"></span></main><script src="./spillbank.js"></script><script src="./bildeprompts-extra.js"></script><script>const $=s=>document.getElementById(s);
function choice(a){return a[Math.floor(Math.random()*a.length)]}
const levelDescriptions={Alle:'Tilfeldig fra alle tilgjengelige nivåer.',Lett:'Uskyldige bilder og små hverdagslige hint.',Flørt:'Personlig, lekent og med litt forventning.',Dristig:'Antrekk, stemning og mer private hint.', 'På kanten':'Mystikk, rollespill og dristig stemning uten eksplisitte detaljer.',Drøye:'Originale, svært direkte bildeoppgaver fra PDF-grunnlaget. Velges bare når du selv ønsker nivået.'};
let previousPrompt=null;let recipient='Baby';
// photoMaster is supplied by spillbank.js
document.querySelectorAll('.photo-role').forEach(btn=>btn.addEventListener('click',()=>{
 recipient=btn.dataset.role;previousPrompt=null;
 document.querySelectorAll('.photo-role').forEach(b=>{const chosen=b===btn;b.classList.toggle('chosen',chosen);b.setAttribute('aria-pressed',String(chosen));});
 $('roleInfo').textContent='Utfordringer til '+recipient;
 $('photoRecipient').textContent='DYPERE · TIL '+recipient.toUpperCase();
 $('photoPrompt').textContent='Trykk på knappen for å trekke en bildeidé.';
 $('photoCard').classList.add('is-ready');$('pLevel').textContent='KLAR?';
}));
function updateLevel(){const l=$('level').value;$('levelInfo').textContent=levelDescriptions[l];}
function draw(){const lev=$('level').value;let arr=(recipient==='Mester'?photoMaster:photo).filter(p=>lev==='Alle'||p[0]===lev);if(recipient==='Baby'&&(lev==='Alle'||lev==='Drøye'))arr=arr.concat(window.DYPERE_BABY_EXTRA.map(t=>['Drøye',t]));if(previousPrompt&&arr.length>1)arr=arr.filter(p=>p!==previousPrompt);const p=choice(arr);if(!p){$('photoPrompt').textContent='Ingen utfordringer tilgjengelig på dette nivået.';return;}previousPrompt=p;$('pLevel').textContent=p[0].toUpperCase();$('photoPrompt').textContent=p[1];$('photoCard').classList.remove('is-ready');}
$('level').onchange=updateLevel;$('drawPhoto').onclick=draw;$('skipPhoto').onclick=draw;updateLevel();
</script><script>
(function(){
 const names=['setup','game','punishment']; let current='setup';
 function show(which){
  current=which;document.querySelectorAll('.play-screen').forEach(e=>e.classList.toggle('active',e.id==='screen-'+which));
  const back=document.getElementById('playBack');back.textContent=which==='setup'?'← Tilbake':'← Tilbake';
  back.setAttribute('href',which==='setup'?'./lek-sammen.html':'#');
  document.getElementById('playStep').textContent=which==='setup'?'01 / 02':which==='game'?'02 / 02':'EKSTRA';
  document.body.dataset.playStage=which;
 }
 document.getElementById('startPlay').onclick=()=>show('game');
 document.getElementById('playBack').addEventListener('click',e=>{if(current==='setup')return;e.preventDefault();show(current==='punishment'?'game':'setup')});
 const punishment=document.getElementById('showPunishment');if(punishment)punishment.onclick=()=>show('punishment');
 const ret=document.getElementById('returnGame');if(ret)ret.onclick=()=>show('game');
 show('setup');
})();</script><script src="./interface.js"></script></body></html>
