<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17131A"><title>DYPERE II</title><style>:root{--bg:#17131A;--card:#211B24;--ink:#F8E6D4;--muted:#B3A0A4;--gold:#CBA77E;--line:#53404A}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,sans-serif}main{max-width:700px;margin:auto;padding:calc(env(safe-area-inset-top) + 18px) 16px 40px}a{color:var(--gold)}header{text-align:center;margin-bottom:18px}.brand{color:var(--gold);letter-spacing:2px;font:normal 38px Georgia,serif}.muted{color:var(--muted)}.box{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:20px;margin:12px 0}h1,h2{font-family:Georgia,serif;font-weight:normal}h1{font-size:31px}.small{font-size:12px;color:var(--gold);letter-spacing:1.5px}button,.btn,select,input,textarea{font:inherit}button,.btn{border:1px solid var(--line);color:var(--ink);background:#302631;border-radius:10px;padding:12px 15px;cursor:pointer}.gold{background:var(--gold);color:var(--bg);border-color:var(--gold);font-weight:700}.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}.chosen{border-color:var(--gold);background:#594034}textarea,input,select{border:1px solid var(--line);color:var(--ink);background:#18131a;padding:12px;border-radius:10px;width:100%}textarea{min-height:66px;resize:vertical}label{display:block;color:var(--muted);font-size:12px;margin:10px 0 5px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{flex:1}nav{margin-bottom:12px}nav a{margin-right:12px}.hide{display:none}.bar{height:4px;background:#392c36;margin:12px 0;border-radius:4px;overflow:hidden}.bar i{display:block;background:var(--gold);height:100%}.question{font:normal clamp(22px,5vw,32px)/1.3 Georgia,serif;min-height:100px;margin:20px 0}.fine{font-size:12px;color:var(--muted)}@media(min-width:600px){.choices{grid-template-columns:repeat(5,1fr)}}@media print{@page{size:A4;margin:14mm}body{background:white;color:black}main{max-width:none}.noprint{display:none!important}.box{background:white;border:0}.question{min-height:0}}</style><link rel="stylesheet" href="./rococo.css"><style>.rococo-quiz-header{height:205px;max-width:450px;margin:10px auto 20px;background:#202A40 url('./ornaments/quiz.svg') center/100% 100% no-repeat;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:5px;text-align:center}.rococo-quiz-header span{font:12px Georgia,serif;color:#DAC59F;letter-spacing:.2em}.rococo-quiz-header strong{font:30px Georgia,serif;color:#F6EBDD}</style></head><body><main><header><div class="small">MESTER ✦ BABY</div><div class="brand">DYPERE</div><div class="muted">Kapittel II · Små overraskelser</div></header><nav class="noprint"><a href="./index.html">← Alle kapitler</a><a href="#" id="archiveLink">Arkiv og eksport</a></nav><section id="setup" class="box"><h1>Små overraskelser</h1><p class="muted">Nærhet, flørt, initiativ og hva som gjør nye opplevelser interessante. · 20 spørsmål</p><label>Rolle</label><select id="role"><option value="">Velg …</option><option>Mester</option><option>Baby</option></select><label>Navn eller kallenavn</label><input id="name" autocomplete="off"><label>Dato</label><input type="date" id="date"><div class="row" style="margin-top:18px"><button class="gold" id="start">Begynn →</button><button id="loadFromStart">Åpne svarfil</button></div></section><section class="box hide" id="survey"><div class="small" id="number"></div><div class="bar"><i id="bar" style="width:0"></i></div><div class="question" id="q"></div><div class="choices" id="opts"></div><label>Kommentar – valgfritt</label><textarea id="comment" placeholder="Dine tanker …"></textarea><div class="row" style="margin-top:14px"><button id="prev">← Forrige</button><button class="gold" id="next">Neste →</button></div><div class="fine" id="state" style="margin-top:14px"></div></section><section class="box hide" id="archive"><h1>Besvarelse og eksport</h1><p class="muted" id="stats"></p><div class="row"><button class="gold" id="export">Lagre JSON</button><button id="print">PDF / Skriv ut</button></div><label>Åpne tidligere JSON-besvarelse</label><input type="file" id="import" accept=".json,application/json"><div class="row" style="margin-top:14px"><button id="back">Til spørsmål</button></div><p class="fine" id="message"></p><div id="report" style="display:none"></div></section></main><script>const QUESTIONS=["Et hotellrom uten planer: foretrekker du at Mester har planlagt alt, eller at dere velger sammen når dere kommer frem?", "Baby får velge mellom en rolig massasje og en overraskelsesdate. Er begge deler like fristende?", "Et kompliment om noe annet enn utseendet: vil du gjerne høre flere slike fra partneren?", "På en date legger Mester igjen et lite, håndskrevet hint om en overraskelse senere. Fristende?", "Kunne en kveld der dere bare kysser og koser uten flere forventninger være noe dere ønsker oftere?", "Vil du at Mester skal gi tydelig beskjed når han ønsker å planlegge en romantisk kveld?", "Baby får velge stemningen, mens Mester velger stedet. Er denne fordelingen interessant?", "Et langt blikk fra partneren på tvers av rommet. Liker du at flørten er så diskret?", "Kunne dere hatt en fast kveld i måneden der den ene står for hele dateplanleggingen?", "Vil du heller motta et overraskende lydklipp med et kompliment enn en vanlig tekstmelding?", "På en kveld ute blir Baby gitt et uskyldig kompliment av ei jente. Kunne dere snakket om reaksjonene etterpå?", "Kunne det vært fint om dere byttet på å velge antrekk til en spesiell date?", "Vil du foretrekke en overraskelse som er avtalt flere dager på forhånd fremfor noe helt spontant?", "Baby får tre lukkede konvolutter med romantiske aktiviteter og velger én. Interessant?", "Kunne en hel kveld med rolig musikk og bare én planlagt aktivitet være mer fristende enn mange overraskelser?", "På en hotellbar later dere som dere møtes for første gang. Vil du at Baby skal ta første initiativ?", "Vil du helst få en tydelig invitasjon til en intim kveld, eller oppdage planen gjennom små hint?", "Kunne dere ha en liten samling med ønsker dere trekker tilfeldig fra når dere vil finne på noe sammen?", "En overraskelse blir avlyst fordi dagsformen ikke passer. Ønsker du at den heller skal spares til senere?", "Når dere prøver noe nytt: er det mer interessant å fortelle hverandre forventningene på forhånd enn å holde alt hemmelig?"];const ID="DYPERE-2026-II", VERSION='1.0';const $=x=>document.getElementById(x);let idx=0, d={surveyId:ID,version:VERSION,role:'',name:'',date:'',answers:{}};const opts=[['ja','Ja'],['apen','Åpen'],['nysgjerrig','Nysgjerrig'],['nei','Nei'],['pass','Pass']];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function visible(id){['setup','survey','archive'].forEach(x=>$(x).classList.toggle('hide',x!==id));window.scrollTo(0,0)}function sync(){d.role=$('role').value;d.name=$('name').value.trim();d.date=$('date').value}function save(){try{localStorage.setItem('dypere_'+ID+'_'+d.role,JSON.stringify(d))}catch(e){$('state').textContent='Lokal lagring utilgjengelig; last ned JSON jevnlig.'}}function render(){let a=d.answers[idx]||{};$('number').textContent=`SPØRSMÅL ${idx+1} / 20`;$('bar').style.width='100%';$('bar').style.transform=`scaleX(${(idx+1)/20})`;$('bar').style.transformOrigin='left';$('q').textContent=QUESTIONS[idx];$('opts').innerHTML='';opts.forEach(([val,label])=>{let b=document.createElement('button');b.textContent=label;b.className=a.choice===val?'chosen':'';b.onclick=()=>{d.answers[idx]={...(d.answers[idx]||{}),choice:val};save();render()};$('opts').append(b)});$('comment').value=a.comment||'';$('next').textContent=idx===19?'Fullfør →':'Neste →';$('prev').disabled=idx===0;$('state').textContent='Lagres lokalt der nettleseren støtter det – last ned JSON som sikkerhetskopi.'}$('comment').oninput=e=>{d.answers[idx]={...(d.answers[idx]||{}),comment:e.target.value};save()};$('start').onclick=()=>{sync();if(!d.role||!d.name){alert('Velg rolle og skriv navn.');return}save();visible('survey');render()};$('next').onclick=()=>{if(idx<19){idx++;render()}else openArchive()};$('prev').onclick=()=>{idx=Math.max(0,idx-1);render()};function openArchive(){visible('archive');$('stats').textContent=`${d.name} · ${d.role} · ${Object.values(d.answers).filter(x=>x.choice).length} av 20 besvart`}$('archiveLink').onclick=e=>{e.preventDefault();openArchive()};$('back').onclick=()=>{visible('survey');render()};function exportJson(){sync();let blob=new Blob([JSON.stringify({...d,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=`DYPERE_${ID}_${d.role}_${d.date}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(u),30000)}$('export').onclick=exportJson;async function importFile(f){if(!f)return;try{let x=JSON.parse(await f.text());if(x.surveyId!==ID||!['Mester','Baby'].includes(x.role)||!x.answers||typeof x.answers!=='object')throw Error('Feil svarfil');d=x;$('role').value=d.role;$('name').value=d.name||'';$('date').value=d.date||'';save();idx=0;visible('survey');render()}catch(e){alert('Kunne ikke åpne svarfil: '+e.message)}}$('import').onchange=e=>importFile(e.target.files[0]);$('loadFromStart').onclick=()=>{$('import').click()};$('print').onclick=()=>{let rows=QUESTIONS.map((q,i)=>`<p><b>${i+1}. ${esc(q)}</b><br> Svar: ${esc(opts.find(x=>x[0]===d.answers[i]?.choice)?.[1]||'Ubesvart')}<br>${esc(d.answers[i]?.comment||'')}</p>`).join('');let w=window.open('','_blank');if(!w){alert('Tillat popup for PDF eller lagre JSON.');return}w.document.write(`<html><meta charset="utf-8"><title>DYPERE rapport</title><body style="font:13px/1.4 Arial;max-width:800px;margin:auto"><h1>${esc(ID)}</h1><p>${esc(d.name)} · ${esc(d.role)} · ${esc(d.date)}</p>${rows}</body></html>`);w.document.close();w.focus();setTimeout(()=>w.print(),300)};$('date').value=new Date().toLocaleDateString('sv-SE');try{let keys=Object.keys(localStorage).filter(k=>k.startsWith('dypere_'+ID+'_'));if(keys.length===1){let x=JSON.parse(localStorage.getItem(keys[0]));if(x.surveyId===ID){d=x;$('role').value=d.role;$('name').value=d.name;$('date').value=d.date}}}catch(e){}</script></body></html>
