<!DOCTYPE html>

<html lang="nb"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/><meta content="#17131A" name="theme-color"/><meta content="yes" name="apple-mobile-web-app-capable"/><meta content="black-translucent" name="apple-mobile-web-app-status-bar-style"/><meta content="DYPERE" name="apple-mobile-web-app-title"/><link href="./manifest.webmanifest" rel="manifest"/><link href="./icons/icon-180.png" rel="apple-touch-icon"/><link href="./interface.css?build=3.0.4-final" rel="stylesheet"/><title>DYPERE · Små ting</title></head><body class="app-body" data-app-version="3.0.4" data-file="kapittel-ii.html" data-layout="questions" data-module="survey" data-parent="bli-kjent.html"><main class="app"><header class="app-header"><a class="nav-button" href="./bli-kjent.html" id="appBack"><svg aria-hidden="true" viewbox="0 0 24 24"><path d="m14 5-7 7 7 7M7 12h13"></path></svg><span>Tilbake</span></a><span class="app-brand">DYPERE</span><a aria-label="Gå til hovedmenyen" class="nav-button" href="./index.html">Hovedmeny</a></header><div class="app-heading"><p class="eyebrow">KAPITTEL II</p><h1 id="appTitle">Små ting</h1></div><section class="box stage setup-stage" id="setup"><div class="surface setup-card"><p class="intro">Nærhet og initiativ. · 20 spørsmål</p><div class="setup-fields"><div class="field"><label for="role">Hvem svarer?</label><select id="role"><option value="">Velg rolle</option><option value="Mester">Mester</option><option value="Baby">Baby</option></select></div><div class="field"><label for="name">Navn</label><input autocomplete="off" id="name" type="text"/></div><div class="field"><label for="date">Dato</label><input autocomplete="off" id="date" type="text"/></div></div><p class="muted fine">Lagres lokalt. Last ned for sikkerhetskopi.</p><div class="button-row setup-actions"><button class="primary" id="start" type="button">Begynn →</button><button class="" id="loadFromStart" type="button">Åpne svarfil</button></div></div></section><section class="box hide stage question-stage" id="survey"><div class="surface question-card"><div class="question-meta"><span id="number"></span></div><div class="progress-track"><i id="bar"></i></div><div class="reading-region"><div class="question" id="q"></div></div><div class="text-pager" hidden=""></div><div aria-label="Svaralternativer" class="answer-grid" id="opts"></div><div class="choice-pager" hidden=""></div></div><div class="button-row auxiliary-actions"><button class="secondary" data-open="commentSheet" id="commentToggle" type="button">Kommentar</button><button class="secondary" data-open="toolsSheet" type="button">Mer</button></div><div class="button-row question-actions"><button class="" id="prev" type="button">← Forrige</button><button class="primary" id="next" type="button">Neste →</button></div><p class="storage-status" id="state" role="status"></p></section><section class="box hide stage archive-stage surface" id="archive"><h1>Besvarelse og eksport</h1><p class="muted" id="stats"></p><div class="button-row"><button class="gold" id="export">Lagre JSON</button><button id="print">PDF / Skriv ut</button></div><label>Åpne tidligere JSON-besvarelse</label><input accept=".json,application/json" id="import" type="file"><div class="button-row"><button id="back">Til spørsmål</button></div><p class="fine" id="message"></p><div id="report"></div></input></section></main><dialog aria-labelledby="commentSheet-title" class="sheet" id="commentSheet"><form class="sheet-top" method="dialog"><h2 id="commentSheet-title">Kommentar</h2><button class="nav-button" type="submit">Ferdig</button></form><div class="sheet-content"><textarea aria-label="Kommentar" class="comment-input" id="comment" placeholder="Dine tanker …"></textarea><p class="fine">Kommentarer lagres sammen med svaret.</p></div></dialog><dialog aria-labelledby="toolsSheet-title" class="sheet" id="toolsSheet"><form class="sheet-top" method="dialog"><h2 id="toolsSheet-title">Verktøy</h2><button class="nav-button" type="submit">Ferdig</button></form><div class="sheet-content"><button class="primary" data-close-sheet="" id="archiveLink" type="button">Arkiv og eksport</button><p class="fine">Svar og kommentarer lagres lokalt. Last ned en sikkerhetskopi.</p></div></dialog><script>const QUESTIONS=["Et hotellrom uten planer: foretrekker du at Mester har planlagt alt, eller at dere velger sammen når dere kommer frem?", "Baby får velge mellom en rolig massasje og en overraskelsesdate. Er begge deler like fristende?", "Et kompliment om noe annet enn utseendet: vil du gjerne høre flere slike fra partneren?", "På en date legger Mester igjen et lite, håndskrevet hint om en overraskelse senere. Fristende?", "Kunne en kveld der dere bare kysser og koser uten flere forventninger være noe dere ønsker oftere?", "Vil du at Mester skal gi tydelig beskjed når han ønsker å planlegge en romantisk kveld?", "Baby får velge stemningen, mens Mester velger stedet. Er denne fordelingen interessant?", "Et langt blikk fra partneren på tvers av rommet. Liker du at flørten er så diskret?", "Kunne dere hatt en fast kveld i måneden der den ene står for hele dateplanleggingen?", "Vil du heller motta et overraskende lydklipp med et kompliment enn en vanlig tekstmelding?", "På en kveld ute blir Baby gitt et uskyldig kompliment av ei jente. Kunne dere snakket om reaksjonene etterpå?", "Kunne det vært fint om dere byttet på å velge antrekk til en spesiell date?", "Vil du foretrekke en overraskelse som er avtalt flere dager på forhånd fremfor noe helt spontant?", "Baby får tre lukkede konvolutter med romantiske aktiviteter og velger én. Interessant?", "Kunne en hel kveld med rolig musikk og bare én planlagt aktivitet være mer fristende enn mange overraskelser?", "På en hotellbar later dere som dere møtes for første gang. Vil du at Baby skal ta første initiativ?", "Vil du helst få en tydelig invitasjon til en intim kveld, eller oppdage planen gjennom små hint?", "Kunne dere ha en liten samling med ønsker dere trekker tilfeldig fra når dere vil finne på noe sammen?", "En overraskelse blir avlyst fordi dagsformen ikke passer. Ønsker du at den heller skal spares til senere?", "Når dere prøver noe nytt: er det mer interessant å fortelle hverandre forventningene på forhånd enn å holde alt hemmelig?"];const ID="DYPERE-2026-II", VERSION='1.0';const $=x=>document.getElementById(x);let idx=0, d={surveyId:ID,version:VERSION,role:'',name:'',date:'',answers:{}};const opts=[['ja','Ja'],['apen','Åpen'],['nysgjerrig','Nysgjerrig'],['nei','Nei'],['pass','Pass']];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function visible(id){['setup','survey','archive'].forEach(x=>$(x).classList.toggle('hide',x!==id));window.scrollTo(0,0)}function sync(){d.role=$('role').value;d.name=$('name').value.trim();d.date=$('date').value}function save(){try{localStorage.setItem('dypere_'+ID+'_'+d.role,JSON.stringify(d))}catch(e){$('state').textContent='Lokal lagring utilgjengelig; last ned JSON jevnlig.'}}function render(){let a=d.answers[idx]||{};$('number').textContent=`SPØRSMÅL ${idx+1} / 20`;$('bar').style.width='100%';$('bar').style.transform=`scaleX(${(idx+1)/20})`;$('bar').style.transformOrigin='left';$('q').textContent=QUESTIONS[idx];$('opts').innerHTML='';opts.forEach(([val,label])=>{let b=document.createElement('button');b.textContent=label;b.className=a.choice===val?'chosen':'';b.onclick=()=>{d.answers[idx]={...(d.answers[idx]||{}),choice:val};save();render()};$('opts').append(b)});$('comment').value=a.comment||'';$('next').textContent=idx===19?'Fullfør →':'Neste →';$('prev').disabled=idx===0;$('state').textContent='Lagres lokalt der nettleseren støtter det – last ned JSON som sikkerhetskopi.'}$('comment').oninput=e=>{d.answers[idx]={...(d.answers[idx]||{}),comment:e.target.value};save()};$('start').onclick=()=>{sync();if(!d.role||!d.name){alert('Velg rolle og skriv navn.');return}save();visible('survey');render()};$('next').onclick=()=>{if(idx<19){idx++;render()}else openArchive()};$('prev').onclick=()=>{idx=Math.max(0,idx-1);render()};function openArchive(){visible('archive');$('stats').textContent=`${d.name} · ${d.role} · ${Object.values(d.answers).filter(x=>x.choice).length} av 20 besvart`}$('archiveLink').onclick=e=>{e.preventDefault();openArchive()};$('back').onclick=()=>{visible('survey');render()};function exportJson(){sync();let blob=new Blob([JSON.stringify({...d,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=`DYPERE_${ID}_${d.role}_${d.date}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(u),30000)}$('export').onclick=exportJson;async function importFile(f){if(!f)return;try{let x=JSON.parse(await f.text());if(x.surveyId!==ID||!['Mester','Baby'].includes(x.role)||!x.answers||typeof x.answers!=='object')throw Error('Feil svarfil');d=x;$('role').value=d.role;$('name').value=d.name||'';$('date').value=d.date||'';save();idx=0;visible('survey');render()}catch(e){alert('Kunne ikke åpne svarfil: '+e.message)}}$('import').onchange=e=>importFile(e.target.files[0]);$('loadFromStart').onclick=()=>{$('import').click()};$('print').onclick=()=>{let rows=QUESTIONS.map((q,i)=>`<p><b>${i+1}. ${esc(q)}</b><br> Svar: ${esc(opts.find(x=>x[0]===d.answers[i]?.choice)?.[1]||'Ubesvart')}<br>${esc(d.answers[i]?.comment||'')}</p>`).join('');let w=window.open('','_blank');if(!w){alert('Tillat popup for PDF eller lagre JSON.');return}w.document.write(`<html><meta charset="utf-8"><title>DYPERE rapport</title><body style="font:13px/1.4 Arial;max-width:800px;margin:auto"><h1>${esc(ID)}</h1><p>${esc(d.name)} · ${esc(d.role)} · ${esc(d.date)}</p>${rows}</body></html>`);w.document.close();w.focus();setTimeout(()=>w.print(),300)};$('date').value=new Date().toLocaleDateString('sv-SE');try{let keys=Object.keys(localStorage).filter(k=>k.startsWith('dypere_'+ID+'_'));if(keys.length===1){let x=JSON.parse(localStorage.getItem(keys[0]));if(x.surveyId===ID){d=x;$('role').value=d.role;$('name').value=d.name;$('date').value=d.date}}}catch(e){}</script><script src="./interface.js"></script></body></html>
