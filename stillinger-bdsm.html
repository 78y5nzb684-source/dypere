<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17131A"><title>DYPERE · Bundet av nysgjerrighet</title><link rel="stylesheet" href="./unified-v3.css"><style>*,*:before,*:after{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{font:15px/1.4 system-ui,-apple-system,sans-serif;background:radial-gradient(ellipse at top,#332436,#17131A 75%);color:#F9EADB}.screen{height:100dvh;max-width:720px;margin:auto;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 16px) 18px calc(env(safe-area-inset-bottom) + 16px);gap:clamp(10px,2dvh,20px)}nav{display:flex;justify-content:space-between;align-items:center;min-height:38px;color:#D8B889;font-size:12px;letter-spacing:.06em}nav a{color:#D8B889;text-decoration:none;padding:9px 0}header{text-align:center}h1{font:normal clamp(29px,7vw,43px)/1.12 Georgia,serif;color:#D8B889;margin:5px 0}header p{margin:6px 0;color:#C2ADB4;font-size:13px}.art{flex:1;min-height:0;border:1px solid #6C5263;background:linear-gradient(145deg,#342736,#201822);border-radius:22px;display:flex;align-items:center;justify-content:center;padding:15px;overflow:hidden}.art img{height:100%;width:100%;object-fit:contain;border-radius:9px}.name{font:normal clamp(21px,5vw,31px)/1.22 Georgia,serif;text-align:center;color:#F9EADB}.count{text-align:center;color:#C2ADB4;font-size:12px}button,.menu-link{width:100%;min-height:52px;border-radius:14px;background:linear-gradient(135deg,#DEC393,#B79569);border:1px solid #EBD6AC;color:#19131A;font:700 15px system-ui;cursor:pointer;padding:12px;text-align:center}.menu-link{display:flex;text-decoration:none;align-items:center;justify-content:center;background:#33283A;color:#F8E6D4;border-color:#655268;flex:1}.actions{display:flex;flex-direction:column;gap:12px;flex:1;min-height:0;justify-content:center}.note{font-size:11px;text-align:center;color:#C2ADB4;margin:0}@media(max-height:700px){header p,.note{display:none}.screen{gap:8px}h1{font-size:28px}}</style><link rel="stylesheet" href="./design-system.css"></head><body><main class="screen"><nav><a href="./stillinger.html">← Tilbake</a><span>STILLINGER · 20</span></nav><header><h1>Bundet av nysgjerrighet</h1><p>Trekk én tilfeldig illustrasjon.</p></header><div class="art"><img id="picture" alt="Illustrasjon" style="display:none"></div><div class="name" id="name">Klar for første trekk?</div><div class="count" id="counter">0 av 20 trukket</div><button id="draw" type="button">✦ Trekk</button><p class="note">Alt er frivillig. Pass er alltid greit.</p><script>const items=[{"name": "Kneeling", "img": "./stillinger-bdsm/01_Kneeling.png"}, {"name": "Over the Knee", "img": "./stillinger-bdsm/02_Over_the_Knee.png"}, {"name": "Wrist to Ankle", "img": "./stillinger-bdsm/03_Wrist_to_Ankle.png"}, {"name": "Matanawa", "img": "./stillinger-bdsm/04_Matanawa.png"}, {"name": "Box Tie", "img": "./stillinger-bdsm/05_Box_Tie.png"}, {"name": "Hip Harness", "img": "./stillinger-bdsm/06_Hip_Harness.png"}, {"name": "Suspension", "img": "./stillinger-bdsm/07_Suspension.png"}, {"name": "Yoke", "img": "./stillinger-bdsm/08_Yoke.png"}, {"name": "Ball Tie", "img": "./stillinger-bdsm/09_Ball_Tie.png"}, {"name": "Mummification", "img": "./stillinger-bdsm/10_Mummification.png"}, {"name": "Spreader Bar", "img": "./stillinger-bdsm/11_Spreader_Bar.png"}, {"name": "Standing Spread", "img": "./stillinger-bdsm/12_Standing_Spread.png"}, {"name": "Spread Eagle", "img": "./stillinger-bdsm/13_Spread_Eagle.png"}, {"name": "Chair", "img": "./stillinger-bdsm/14_Chair.png"}, {"name": "Crab Tie", "img": "./stillinger-bdsm/15_Crab_Tie.png"}, {"name": "Hogtie", "img": "./stillinger-bdsm/16_Hogtie.png"}, {"name": "Frog Tie", "img": "./stillinger-bdsm/17_Frog_Tie.png"}, {"name": "Pet Play", "img": "./stillinger-bdsm/18_Pet_Play.png"}, {"name": "Chest Harness", "img": "./stillinger-bdsm/19_Chest_Harness.png"}, {"name": "Face Down", "img": "./stillinger-bdsm/20_Face_Down.png"}];let pool=[],last=-1;function draw(){if(!pool.length)pool=items.map((_,i)=>i);let i=Math.floor(Math.random()*pool.length);if(pool.length>1&&pool[i]===last)i=(i+1)%pool.length;let choice=pool.splice(i,1)[0];last=choice;document.getElementById("picture").src=items[choice].img;document.getElementById("picture").style.display="block";document.getElementById("name").textContent=items[choice].name;document.getElementById("counter").textContent=(items.length-pool.length)+" av "+items.length+" trukket";document.getElementById("draw").textContent=pool.length?"Trekk ny":"Start ny runde"}document.getElementById("draw").addEventListener("click",draw);</script></main></body></html>
