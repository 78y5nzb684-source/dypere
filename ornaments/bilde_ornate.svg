<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 720" width="500" height="720">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5EBD0"/>
      <stop offset="40%" style="stop-color:#D5B3AA"/>
      <stop offset="100%" style="stop-color:#D5B3AA"/>
    </linearGradient>
  </defs>
  <rect width="500" height="720" fill="#352337"/>
  
  <!-- Double border -->
  <rect x="18" y="18" width="464" height="684" fill="none" stroke="url(#gold)" stroke-width="2.5" rx="4"/>
  <rect x="28" y="28" width="444" height="664" fill="none" stroke="url(#gold)" stroke-width="0.6" opacity="0.4"/>
  
  <!-- Elaborate corners -->
  <g fill="url(#gold)">
    <!-- Top left -->
    <g transform="translate(18,18)">
      <path d="M0,50 C18,35 28,18 45,12 C28,4 45,-6 58,6 L48,16 C38,10 30,20 22,32 C14,20 6,28 0,42 Z"/>
      <path d="M10,10 C20,14 16,26 26,22 C18,16 12,10 10,10" opacity="0.8"/>
      <circle cx="16" cy="16" r="3"/>
      <path d="M6,28 Q16,22 20,34" opacity="0.5"/>
    </g>
    <!-- Top right -->
    <g transform="translate(482,18) scale(-1,1)">
      <path d="M0,50 C18,35 28,18 45,12 C28,4 45,-6 58,6 L48,16 C38,10 30,20 22,32 C14,20 6,28 0,42 Z"/>
      <path d="M10,10 C20,14 16,26 26,22 C18,16 12,10 10,10" opacity="0.8"/>
      <circle cx="16" cy="16" r="3"/>
    </g>
    <!-- Bottom left -->
    <g transform="translate(18,702) scale(1,-1)">
      <path d="M0,50 C18,35 28,18 45,12 C28,4 45,-6 58,6 L48,16 C38,10 30,20 22,32 C14,20 6,28 0,42 Z"/>
      <circle cx="16" cy="16" r="3"/>
    </g>
    <!-- Bottom right -->
    <g transform="translate(482,702) scale(-1,-1)">
      <path d="M0,50 C18,35 28,18 45,12 C28,4 45,-6 58,6 L48,16 C38,10 30,20 22,32 C14,20 6,28 0,42 Z"/>
      <circle cx="16" cy="16" r="3"/>
    </g>
  </g>
  
  <!-- Top center flourish -->
  <g transform="translate(250,55)" fill="url(#gold)">
    <path d="M-55,0 Q-28,-16 0,-22 Q28,-16 55,0 Q28,10 0,14 Q-28,10 -55,0" opacity="0.85"/>
    <path d="M-25,4 Q0,-8 25,4 Q0,10 -25,4" opacity="0.5"/>
    <path d="M-8,-4 L0,-16 L8,-4" opacity="0.7"/>
    <circle cx="0" cy="0" r="3.5"/>
  </g>
  
  <!-- BILDE -->
  <text x="250" y="280" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="64" fill="#F6EBDD" letter-spacing="10">BILDE</text>
  
  <!-- Underline -->
  <g transform="translate(250,305)">
    <line x1="-70" y1="0" x2="-15" y2="0" stroke="url(#gold)" stroke-width="1.2"/>
    <line x1="15" y1="0" x2="70" y2="0" stroke="url(#gold)" stroke-width="1.2"/>
    <g fill="url(#gold)">
      <circle cx="0" cy="0" r="3"/>
      <path d="M-6,-4 L0,-12 L6,-4" opacity="0.7"/>
    </g>
  </g>
  
  <!-- Subtitle -->
  <text x="250" y="360" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#F6EBDD" opacity="0.85">Trekk en utfordring</text>
  
  <!-- Center ornament -->
  <g transform="translate(250,460)" fill="url(#gold)" opacity="0.7">
    <path d="M-40,0 Q-20,-25 0,-34 Q20,-25 40,0 Q20,16 0,24 Q-20,16 -40,0"/>
    <path d="M-18,6 Q0,-12 18,6 Q0,16 -18,6" opacity="0.5"/>
    <path d="M-6,-6 L0,-20 L6,-6"/>
    <circle cx="0" cy="4" r="2.5"/>
  </g>
  
  <!-- Bottom text -->
  <text x="250" y="580" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#D5B3AA" letter-spacing="2" opacity="0.8">MESTER ✦ BABY</text>
  
  <!-- Bottom flourish -->
  <g transform="translate(250,650) scale(1,-1)" fill="url(#gold)" opacity="0.75">
    <path d="M-45,0 Q-22,-12 0,-16 Q22,-12 45,0 Q22,8 0,12 Q-22,8 -45,0"/>
    <circle cx="0" cy="0" r="2.5"/>
  </g>
  
  <!-- Side ornaments -->
  <g transform="translate(40,360)" fill="url(#gold)" opacity="0.25">
    <path d="M0,-50 Q12,-25 8,0 Q12,25 0,50 Q-8,25 -12,0 Q-8,-25 0,-50"/>
  </g>
  <g transform="translate(460,360) scale(-1,1)" fill="url(#gold)" opacity="0.25">
    <path d="M0,-50 Q12,-25 8,0 Q12,25 0,50 Q-8,25 -12,0 Q-8,-25 0,-50"/>
  </g>
</svg>
